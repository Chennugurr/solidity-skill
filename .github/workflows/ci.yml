name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - name: Validate suite
        run: python3 scripts/validate-suite.py --package --compile-templates

      - name: Install Slither
        run: python3 -m pip install slither-analyzer

      - name: Run Slither template scan
        run: python3 scripts/run-slither-template-check.py
        continue-on-error: true
