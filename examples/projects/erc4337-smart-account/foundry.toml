[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "forge-std/=dependencies/forge-std-1.16.2/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
  "@account-abstraction/=dependencies/account-abstraction-0.9.0/"
]

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.6.1"
account-abstraction = { version = "0.9.0", git = "https://github.com/eth-infinitism/account-abstraction.git", tag = "v0.9.0" }
